# the tests on every push and pull request: every suite on Cont, Cont0 and the references, TestAgree, the guide;
# the benchmarks compiled, not run — their numbers are a quiet machine's, not CI's
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch test Jmh/compile
